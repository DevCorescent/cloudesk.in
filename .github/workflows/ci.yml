# Every push and pull request: types, lint, the full test suite against Postgres, and a production build.
name: CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: cloudesk, POSTGRES_PASSWORD: cloudesk, POSTGRES_DB: cloudesk_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cloudesk" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://cloudesk:cloudesk@localhost:5432/cloudesk_test
      TEST_DATABASE_URL: postgres://cloudesk:cloudesk@localhost:5432/cloudesk_test
      APP_URL: http://localhost:3000
      APP_ENCRYPTION_KEY: ${{ secrets.CI_APP_ENCRYPTION_KEY }}
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run db:migrate:test
      - run: npx vitest run --testTimeout 120000 --hookTimeout 240000
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
