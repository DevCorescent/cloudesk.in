# Every push and pull request: types, lint, the full test suite against Postgres, and a production build.
name: CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: cloudesk, POSTGRES_PASSWORD: cloudesk, POSTGRES_DB: cloudesk_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cloudesk -d cloudesk_test" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://cloudesk:cloudesk@localhost:5432/cloudesk_test
      TEST_DATABASE_URL: postgres://cloudesk:cloudesk@localhost:5432/cloudesk_test
      APP_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      # A throwaway key for this run only; nothing here holds real data.
      - run: echo "APP_ENCRYPTION_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run db:migrate:test
      - run: npx vitest run --testTimeout 120000 --hookTimeout 240000
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
