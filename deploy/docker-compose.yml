# A small production-shaped setup on one host: Postgres, a migration step,
# web servers (scale with `docker compose up --scale web=3`) and exactly one worker.
# Put Caddy, Nginx or a cloud load balancer with TLS in front of `web`.
# Secrets come from .env.production (never commit it).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: cloudesk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: cloudesk
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U cloudesk"], interval: 5s, retries: 20 }

  migrate:
    image: cloudesk
    build: { context: .., dockerfile: deploy/Dockerfile }
    env_file: ../.env.production
    environment: { DATABASE_URL: "postgres://cloudesk:${POSTGRES_PASSWORD}@db:5432/cloudesk" }
    command: ["node", "scripts/migrate.mjs"]
    depends_on: { db: { condition: service_healthy } }

  web:
    image: cloudesk
    env_file: ../.env.production
    environment:
      DATABASE_URL: "postgres://cloudesk:${POSTGRES_PASSWORD}@db:5432/cloudesk"
      APP_ROLE: "web"
    ports: ["3000"]
    depends_on: { migrate: { condition: service_completed_successfully } }

  worker:
    image: cloudesk
    env_file: ../.env.production
    environment: { DATABASE_URL: "postgres://cloudesk:${POSTGRES_PASSWORD}@db:5432/cloudesk" }
    depends_on: { migrate: { condition: service_completed_successfully } }

volumes:
  pgdata:
