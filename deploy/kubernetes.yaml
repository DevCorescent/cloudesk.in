# Reference Kubernetes setup: a migration Job per release, an autoscaled web
# Deployment (worker off) and a small worker Deployment. Use a managed Postgres
# (with point-in-time recovery) and keep secrets in a Secret named cloudesk-env
# (DATABASE_URL, APP_URL, APP_ENCRYPTION_KEY, MAIL_*, billing keys…).
apiVersion: batch/v1
kind: Job
metadata: { name: cloudesk-migrate }
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: your-registry/cloudesk:RELEASE
          command: ["node", "scripts/migrate.mjs"]
          envFrom: [{ secretRef: { name: cloudesk-env } }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: cloudesk-web }
spec:
  replicas: 3
  selector: { matchLabels: { app: cloudesk-web } }
  template:
    metadata: { labels: { app: cloudesk-web } }
    spec:
      containers:
        - name: web
          image: your-registry/cloudesk:RELEASE
          ports: [{ containerPort: 3000 }]
          envFrom: [{ secretRef: { name: cloudesk-env } }]
          env: [{ name: APP_ROLE, value: "web" }]
          resources: { requests: { cpu: 500m, memory: 768Mi }, limits: { memory: 1536Mi } }
          readinessProbe: { httpGet: { path: /api/v1/health, port: 3000 }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /api/v1/health/live, port: 3000 }, periodSeconds: 30, failureThreshold: 4 }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: cloudesk-web }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: cloudesk-web }
  minReplicas: 3
  maxReplicas: 20
  metrics: [{ type: Resource, resource: { name: cpu, target: { type: Utilization, averageUtilization: 65 } } }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: cloudesk-worker }
spec:
  replicas: 1
  selector: { matchLabels: { app: cloudesk-worker } }
  template:
    metadata: { labels: { app: cloudesk-worker } }
    spec:
      containers:
        - name: worker
          image: your-registry/cloudesk:RELEASE
          envFrom: [{ secretRef: { name: cloudesk-env } }]
          resources: { requests: { cpu: 250m, memory: 512Mi }, limits: { memory: 1Gi } }
---
apiVersion: v1
kind: Service
metadata: { name: cloudesk-web }
spec:
  selector: { app: cloudesk-web }
  ports: [{ port: 80, targetPort: 3000 }]
